<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Курс по трейдингу — с нуля до первой стратегии</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--card:#fff;--card2:#f7f7f7;--line:#e5e5e5;--text:#1a1a1a;--muted:#666;--green:#15803d;--blue:#1d4ed8;--red:#b91c1c;color-scheme:light}
[data-theme="dark"]{--bg:#101214;--card:#101214;--card2:#1a1d21;--line:#2b2f34;--text:#e8eaed;--muted:#9aa0a8;--green:#4ade80;--blue:#8ab4f8;--red:#f87171;color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.7}
.container{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.logo{color:var(--text);text-decoration:none;font-weight:700;font-size:1rem}
.header-right{display:flex;align-items:center;gap:14px}
.theme-btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:.9rem;line-height:1.5;cursor:pointer}
.theme-btn:hover{border-color:var(--text)}
.progress-bar{height:3px;background:var(--line);overflow:hidden}
#progressFill{height:100%;width:0;background:var(--text);transition:width .4s}
#progressText{color:var(--muted);font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
main{padding:32px 0 48px}
.hero h1{font-size:1.8rem;margin-bottom:8px;letter-spacing:-.01em}
.hero p{color:var(--muted);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:20px 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;text-decoration:none;color:var(--text);display:block;transition:border-color .15s}
.card:hover{border-color:var(--text)}
.card-done{border-color:var(--green)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.icon{font-size:1.4rem}
.check{color:var(--green);font-weight:700;font-size:1.1rem}
.card-num{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.card-title{font-weight:600;margin-bottom:4px}
.card-sub{color:var(--muted);font-size:.85rem}
.btn{display:inline-block;background:var(--text);color:var(--bg);border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{opacity:.85}
.btn.done{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.small{padding:7px 14px;font-size:.85rem}
.btn-outline{display:inline-block;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 16px;text-decoration:none;font-size:.9rem;cursor:pointer;background:transparent}
.btn-outline:hover{border-color:var(--text)}
.warnb,.note,.key,.example{background:var(--card2);border-radius:8px;padding:14px 16px;margin:16px 0;font-size:.95rem}
.warnb{border-left:3px solid var(--red)}
.note{border-left:3px solid var(--blue)}
.key{border-left:3px solid var(--green)}
.back{display:inline-block;color:var(--muted);text-decoration:none;margin-bottom:16px;font-size:.9rem}
.back:hover{color:var(--text)}
.lesson h1{font-size:1.5rem;margin:2px 0 14px;letter-spacing:-.01em}
.lesson h3{margin:28px 0 10px;font-size:1.05rem;font-weight:600}
.lesson p{margin:10px 0}
.lesson ul,.lesson ol{margin:10px 0 10px 20px}
.lesson li{margin:6px 0}
.lesson pre{background:var(--card2);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:12px 0;font-size:.85rem;line-height:1.5}
.lesson table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem}
.lesson th{text-align:left;font-weight:600;border-bottom:2px solid var(--text)}
.lesson th,.lesson td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
.lesson-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.icon.big{font-size:2rem}
.task{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0}
.task-q{margin-bottom:10px}
.answer{display:none;margin-top:12px;background:var(--card2);border-radius:8px;padding:12px 14px;font-size:.94rem}
.answer.open{display:block}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:20px 0 32px;color:var(--muted);font-size:.82rem;text-align:center}
@media(max-width:520px){.header-inner{justify-content:center}.nav{flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="container header-inner">
    <a href="#" class="logo">Курс по трейдингу</a>
    <div class="header-right">
      <span id="progressText">0 / 13</span>
      <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="Переключить тему">🌙</button>
    </div>
  </div>
  <div class="progress-bar"><div id="progressFill"></div></div>
</header>
<main class="container" id="app"></main>
<footer><div class="container">Образовательный курс. Не является индивидуальной инвестиционной рекомендацией. Торговля сопряжена с риском потери капитала.</div></footer>

<script>
const KEY = 'trading_course_progress_v1';
const THEME_KEY = 'trading_course_theme_v1';

function applyTheme(t){
  document.documentElement.dataset.theme = t;
  const btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem(THEME_KEY, t);
}

function toggleTheme(){
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}

const MODULES = [
{id:1, icon:'🏦', title:'Как устроены рынки', sub:'Биржа, участники, ликвидность, стакан', min:8, content:`
<p>Биржа — это организованный рынок, где встречаются покупатели и продавцы. Цена любого актива — точка, где спрос встречает предложение, и она меняется каждую секунду.</p>
<h3>Кто участвует в торгах</h3>
<ul>
<li><b>Розничные трейдеры</b> — частные лица вроде нас. Самая слабая сторона рынка: меньше денег, скорости и информации.</li>
<li><b>Фонды и банки</b> — «умные деньги» с аналитиками и миллиардными портфелями.</li>
<li><b>Маркет-мейкеры</b> — поддерживают торговлю, выставляя заявки на покупку и продажу, зарабатывают на спреде.</li>
<li><b>Алгоритмы</b> — роботы, исполняющие сделки за миллисекунды. В скорости с ними спорить бесполезно.</li>
</ul>
<h3>Ликвидность и спред</h3>
<p>Ликвидность — способность купить или продать актив быстро и без потери цены. Ориентир — объёмы торгов: чем выше, тем лучше.</p>
<div class="note">💡 У ликвидных активов (Сбербанк, Bitcoin) спред — доли процента. У неликвидных — несколько процентов: каждый вход и выход сразу «стоит» вам эти деньги.</div>
<h3>Биржевой стакан</h3>
<p>Стакан — очередь заявок: <b>bid</b> — заявки на покупку, <b>ask</b> — на продажу. Разница лучших цен — <b>спред</b>.</p>
<pre>Продажа  100.08   500 шт
Продажа  100.07  1200 шт   ← лучшая цена продажи (ask)
──────────────────────────
Покупка  100.05   900 шт   ← лучшая цена покупки (bid)
Покупка  100.04  2000 шт
</pre>
<p>Спред здесь 0,02 (0,02%). Купить по рынку и сразу продать = потерять величину спреда.</p>
<h3>Плотности, стены и спуфинг</h3>
<p><b>Плотность</b> — уровень с аномально крупным объёмом заявок: там, где обычно стоят сотни штук, вдруг десятки тысяч. Крупную плотность называют <b>стеной</b>: цена о неё спотыкается — и либо долго её грызёт, либо разворачивается.</p>
<ul>
<li><b>Стена на пути цены</b> — вероятный уровень торможения или разворота: поддержка/сопротивление, видимое без индикаторов.</li>
<li><b>Снос стены</b> — агрессивные рыночные заявки съедают плотность за секунды: крупный игрок решил купить или продать любой ценой. Пройденную стену цена обычно уже не возвращает — уровень становится разгоняющим.</li>
<li><b>Стоп за плотностью, а не перед ней.</b> Уровни пробивают «по тонкому» — там, где заявок мало. Стоп логично ставить за крупной плотностью: её дольше разгрызать.</li>
</ul>
<div class="warnb">⚠️ <b>Спуфинг</b> — стены рисуют. Крупный игрок выставляет десятки тысяч лотов, чтобы цена откатилась к его настоящей заявке, — и снимает стену до исполнения. Пока заявка стоит в стакане, это не намерение, а картинка. Исполненные сделки (лента) — правда; стакан — только намёк.</div>
<div class="note">💡 Эту тему развивает footprint-анализ (дельта, кластеры) — отдельные платные терминалы и следующий уровень. Для старта достаточно спреда, плотностей и здорового недоверия к стенам.</div>
<h3>Время работы</h3>
<ul>
<li><b>Акции</b> торгуются сессиями (московская биржа: ~10:00–18:50 плюс вечерняя сессия). Между сессиями возможны <b>гэпы</b> — разрывы цены.</li>
<li><b>Крипта</b> — 24/7 без выходных: стоп-лосс сработает даже ночью, но и пампы/сливы случаются ночью.</li>
</ul>`,
tasks:[
{q:'Откройте стакан любой ликвидной акции или Bitcoin в приложении брокера/биржи. Выпишите лучшую цену покупки и продажи, посчитайте спред в процентах.',
 a:'Спред = (ask − bid) / bid × 100. Пример: bid 100,05, ask 100,07 → 0,02 / 100,05 ≈ 0,02%. Чем меньше — тем дешевле входить и выходить.'},
{q:'Почему у Сбербанка спред — копейки, а у акции третьего эшелона — несколько процентов?',
 a:'Из-за ликвидности. По Сберу ежедневно проходят огромные обороты, за каждую цену конкурирует много участников, и они сдвигают заявки на копейки. В неликвиде покупателей мало: чтобы продать, приходится уступать в цене сразу на проценты.'},
{q:'Откройте стакан ликвидного фьючерса (Si, RTS) или Bitcoin. Найдите самую крупную плотность с каждой стороны. Понаблюдайте 15–20 минут: когда цена дошла до стены — был отбой или снос? Что при этом показывает лента сделок?',
 a:'Отбой выглядит так: цена подходит к стене, рыночных сделок на снос мало, плотность не тает — лимитчики пересиживают, цена откатывает. Снос: в ленте поток агрессивных сделок по цене стены, плотность съедается за секунды, пройденный уровень цена не возвращает. Если стену сняли до касания — это был спуфинг: исполненных сделок по этому уровню не будет вовсе.'}
]},

{id:2, icon:'🧰', title:'Инструменты трейдера', sub:'Брокер, ордера, плечо, комиссии', min:10, content:`
<h3>Брокер</h3>
<p>Через брокера вы выходите на биржу. Критерии: лицензия ЦБ, комиссии, удобное приложение. В РФ — Т-Инвестиции, БКС, Финам; за рубежом — Interactive Brokers и аналоги. Для крипты — крупные биржи (Bybit, OKX и др.).</p>
<h3>Типы ордеров — выучить наизусть</h3>
<table>
<tr><th>Ордер</th><th>Что делает</th><th>Когда использовать</th></tr>
<tr><td>Рыночный</td><td>Купить/продать прямо сейчас</td><td>Когда скорость важнее цены (риск проскальзывания)</td></tr>
<tr><td>Лимитный</td><td>Исполнится по вашей цене или лучше</td><td>Вход по уровню, покупка в откат</td></tr>
<tr><td>Стоп-лосс</td><td>Продаст при падении до заданной цены</td><td>Всегда. Защита от большого убытка</td></tr>
<tr><td>Тейк-профит</td><td>Зафиксирует прибыль по цели</td><td>Всегда, вместе со стопом</td></tr>
<tr><td>Стоп-лимит</td><td>По достижении цены выставит лимитную заявку</td><td>Защита от продажи по грабительской цене при резком движении</td></tr>
</table>
<h3>Время жизни заявки</h3>
<ul>
<li><b>«До отмены» (GTC)</b> — стоит, пока не исполнится или пока вы её не снимете. Удобно для уровней, но забытые заявки «протухают»: проверяйте открытые перед выходными.</li>
<li><b>«Сегодня» (Day)</b> — снимется сама в конце сессии. Безопасный выбор по умолчанию.</li>
<li><b>IOC / FOK</b> — исполниться немедленно: полностью (FOK) или частично с отменой остатка (IOC). Инструмент алготрейдеров и тонких стаканов, вручную нужен редко.</li>
</ul>
<div class="note">💡 Трейлинг-стоп — у большинства брокеров отдельный тип заявки: задаёте расстояние (например, 2 ATR), и стоп сам подтягивается за ценой. Как использовать его в стратегии — модуль 12.</div>
<h3>Плечо</h3>
<p>Плечо — торговля на заёмные средства. Увеличивает и прибыль, и убыток.</p>
<div class="example">Депозит 10 000 ₽, плечо ×5 → позиция 50 000 ₽. Рост 10% = +5 000 ₽ (+50% к депозиту!). Падение 20% = −10 000 ₽ — депозит обнулён.</div>
<div class="warnb">⚠️ При падении маржи ниже минимума брокер принудительно закроет позиции (<b>маржин-колл</b>). Плечо — главный «убийца» счетов новичков.</div>
<h3>Комиссии</h3>
<p>Каждая сделка стоит денег: комиссия брокера и биржи. Много сделок = много расходов. На мелких суммах комиссии легко съедают всю прибыль (подробнее в модуле 7).</p>`,
tasks:[
{q:'Вы купили акцию по 200 ₽ и решили: максимальный убыток — 4%. Какой ордер выставить и по какой цене?',
 a:'Стоп-лосс на 192 ₽ (200 − 4%), выставляется сразу при покупке, а не «потом». Вместо стоп-лосса можно использовать стоп-лимит — он защитит от продажи по ужасной цене при резком проколе цены.'},
{q:'Депозит 50 000 ₽, покупка с плечом ×10 на всю сумму. Цена упала на 10%. Сколько осталось от депозита?',
 a:'Позиция 500 000 ₽, убыток 10% = 50 000 ₽ — это 100% депозита, счёт обнулён (маржин-колл). Именно поэтому правило риска 1–2% из модуля 5 — не рекомендация, а закон выживания.'}
]},

{id:3, icon:'📊', title:'Фундаментальный анализ', sub:'Отчётность, мультипликаторы, макро', min:9, content:`
<p>Фундаментальный анализ отвечает на вопрос <b>что покупать</b>: это оценка бизнеса, стоящего за акцией. В долгосроке цена следует за прибылью компании.</p>
<h3>Отчётность — «паспорт» компании</h3>
<ul>
<li><b>Отчёт о прибылях и убытках</b> — зарабатывает ли компания: выручка, чистая прибыль, динамика.</li>
<li><b>Баланс</b> — что имеет и кому должна: активы и долги.</li>
<li><b>Движение денежных средств</b> — реальные деньги на счетах. Прибыль «на бумаге» может быть виртуальной, кэш — нет.</li>
</ul>
<h3>Ключевые мультипликаторы</h3>
<ul>
<li><b>P/E</b> — цена / прибыль: за сколько лет прибыль «окупит» текущую цену. Низкий — дешевле, сравнивать внутри одной отрасли.</li>
<li><b>P/S</b> — цена / выручка, полезен для убыточных компаний.</li>
<li><b>EV/EBITDA</b> — оценка с учётом долгов, честнее P/E.</li>
<li><b>ROE</b> — отдача на капитал; устойчиво выше 15–20% — качественный бизнес.</li>
<li><b>Долг / EBITDA</b> — долговая нагрузка; выше 3 — тревожно.</li>
</ul>
<h3>Катализаторы</h3>
<p>Цена двигается на событиях: квартальные отчёты, дивиденды, сделки, новые продукты. Дата отчёта — всегда повышенная волатильность.</p>
<h3>Макро</h3>
<p>Ставка ЦБ, инфляция, курс валюты двигают рынок целиком. Рост ставки — обычно давление на акции: деньги перетекают в депозиты и облигации.</p>
<h3>Экономический календарь</h3>
<p>Ключевые события известны заранее: заседания ЦБ (ставка), инфляция (CPI), занятость; для РФ-рынка ещё цена нефти и курс рубля. Календарь — на Investing.ru, в терминале брокера и на сайте ЦБ. Правило: не открывать новые позиции за 15–30 минут до важной цифры — спред расширяется, а стопы выносит ложным движением в обе стороны.</p>
<h3>Облигации и дивиденды — альтернатива спекуляциям</h3>
<p>Прежде чем торговать, посчитайте безрисковую базу: ОФЗ и длинные депозиты дают доходность около ключевой ставки — без единого стопа и без экрана. Дивидендные акции платят 8–15% годовых за просто владение. Ваша система должна зарабатывать больше этой базы <b>с поправкой на риск и потраченное время</b> — иначе трейдинг не окупает собственный риск. Многие после этого расчёта честно выбирают «купить и держать» — и это тоже правильный результат.</p>`,
tasks:[
{q:'Найдите на smart-lab.ru или сайте биржи мультипликаторы двух компаний из разных отраслей (например, банк и ритейлер). Сравните P/E и объясните разницу.',
 a:'Разный P/E — не «дёшево/дорого», а разные ожидания: растущему бизнесу рынок прощает высокий P/E, потому что прибыль завтра будет больше. Банки традиционно торгуются с низким P/E. Вывод: мультипликаторы сравнивают внутри отрасли и в динамике.'},
{q:'P/E компании — 5. Это гарантированно дёшево и пора покупать?',
 a:'Нет. Низкий P/E часто означает, что рынок ждёт падения прибыли: циклическая отрасль на пике, проблемы с долгами, риски. Смотрите устойчивость прибыли, долги и прогноз отрасли.'}
]},

{id:4, icon:'📈', title:'Технический анализ', sub:'Свечи, тренд, уровни, индикаторы', min:12, content:`
<p>Технический анализ отвечает на вопрос <b>когда покупать</b>: это изучение графика цены и объёмов.</p>
<h3>Свечи</h3>
<p>Каждая свеча показывает 4 цены за период: открытие, максимум, минимум, закрытие. Зелёная — закрытие выше открытия, красная — ниже. Длинное тело — сильное движение, длинные тени — борьба покупателей и продавцов.</p>
<h3>Тренд</h3>
<ul>
<li><b>Восходящий</b>: максимумы и минимумы становятся выше.</li>
<li><b>Нисходящий</b>: ниже.</li>
<li><b>Боковик</b>: цена ходит в диапазоне.</li>
</ul>
<p>Базовое правило: торгуйте по тренду — покупки в восходящем, продажи в нисходящем.</p>
<h3>Поддержка и сопротивление</h3>
<p>Уровни, где цена разворачивалась раньше. Чем больше касаний и чем заметнее уровень на старшем таймфрейме, тем он сильнее. Пробой + закрепление — сигнал продолжения движения.</p>
<h3>Паттерны</h3>
<p>Повторяющиеся фигуры: <b>голова и плечи</b> (разворот вниз), <b>двойная вершина/дно</b> (разворот), <b>треугольники</b> и <b>флаги</b> (продолжение тренда). Паттерн работает только вместе с уровнем и объёмом.</p>
<h3>Индикаторы</h3>
<ul>
<li><b>EMA 50 и 200</b> — направление тренда; цена выше растущей EMA — приоритет покупок.</li>
<li><b>RSI</b> — выше 70 перекупленность, ниже 30 перепроданность (работает в боковике).</li>
<li><b>MACD</b> — импульс и пересечения.</li>
<li><b>ATR</b> — средний размах свечи; стоп логично ставить в 1,5–2 ATR.</li>
<li><b>Объём</b> — движение с высоким объёмом надёжнее движения «на пустом» рынке.</li>
</ul>
<div class="warnb">⚠️ Индикаторы подтверждают идею, но не создают её. Ни один индикатор не работает сам по себе — это фильтры, а не грааль.</div>
<h3>Мультитаймфреймовый анализ</h3>
<p>Направление задаёт старший таймфрейм, момент входа ищет младший. Классика для свинга: тренд и уровни — на дневном графике, точка входа с компактным стопом — на часовом. Покупать на часовике против дневного тренда — самая частая ошибка новичка: сделка «выглядит хорошо» ровно до того, как возвращается главное течение.</p>`,
tasks:[
{q:'Откройте TradingView, найдите 3 ликвидные бумаги. По каждой определите: тренд (вверх/вниз/боковик), ближайшие поддержку и сопротивление. Запишите вывод: покупки уместны или нет.',
 a:'Ориентир: цена выше растущей EMA200 и максимумы растут — тренд вверх, покупки по откатам к поддержке. Цена под EMA200 с понижающимися максимумами — покупки запрещены вашей же системой. Нет тренда — нет сделки.'},
{q:'RSI показал 75. Значит, пора продавать?',
 a:'Нет. В сильном восходящем тренде RSI может держаться выше 70 неделями, пока цена продолжает расти — «продажа в перекупленности» регулярно сливает трейдеров. RSI полезен в боковике; в тренде это лишь повод не покупать по рынку и ждать откат.'}
]},

{id:5, icon:'🛡️', title:'Риск-менеджмент', sub:'Правила выживания: 1%, стопы, R:R', min:10, content:`
<p>Это главный модуль курса. Рынок переживают не те, кто лучше всех прогнозирует, а те, кто <b>переживает серии убытков</b>.</p>
<h3>Три железных правила</h3>
<ol>
<li><b>Риск на сделку — 1–2% депозита.</b> Если стоп срабатывает, вы потеряете 1–2%, а не «сколько получится».</li>
<li><b>Стоп-лосс в каждой сделке.</b> Выставляется одновременно с входом. Без стопа сделка не существует.</li>
<li><b>Риск/прибыль минимум 1:2.</b> Рискуете 1, чтобы заработать 2. Тогда прибыльной может быть система даже с 40% верных сделок.</li>
</ol>
<h3>Расчёт размера позиции</h3>
<pre>Размер позиции = (Депозит × % риска) / Расстояние до стопа</pre>
<div class="example">Депозит 100 000 ₽, риск 1% = 1 000 ₽. Вход по 200 ₽, стоп 190 ₽ (−5%).<br>Позиция = 1 000 / 0,05 = 20 000 ₽ (100 акций). Проверка: падение до 190 = убыток ровно 1 000 ₽ = 1% счёта.</div>
<h3>Математика просадок</h3>
<table>
<tr><th>Просадка</th><th>Нужный рост для восстановления</th></tr>
<tr><td>−10%</td><td>+11%</td></tr>
<tr><td>−30%</td><td>+43%</td></tr>
<tr><td>−50%</td><td>+100%</td></tr>
<tr><td>−90%</td><td>+900%</td></tr>
</table>
<h3>Риск портфеля, а не только сделки</h3>
<p>Правило 1% работает, пока позиции не зависят друг от друга. Три лонга по 1% в трёх банках — это одна ставка на сектор размером 3%. Альткоины при падении BTC летят вниз все одновременно.</p>
<ul>
<li>Суммарный риск всех открытых позиций — не более 3–5% счёта.</li>
<li>Связанные активы (одна отрасль, один «драйвер» вроде BTC или нефти) считайте одной позицией.</li>
<li><b>Лимит дня:</b> −3% за день → терминал закрыт до завтра, какие бы сетапы ни маячили.</li>
<li><b>Лимит недели:</b> −6% за неделю → пауза, разбор журнала, следующая неделя — половинным размером.</li>
</ul>
<h3>Стоп не гарантирует цену</h3>
<p>Стоп-лосс — приказ «продать по рынку, как только цена коснулась уровня». Если рынок открылся гэпом ниже стопа или покупателей в стакане нет, исполнение пройдёт по первой доступной цене — хуже плановой. Поэтому:</p>
<ul>
<li>Фактический убыток бывает больше плановых 1%: на гэпах и новостях — заметно больше.</li>
<li>Ставьте стоп за пределами шума (1,5–2 ATR) и не вплотную к уровню, где стоят стопы толпы.</li>
<li>Через выходные и отчёты держите уменьшенный размер — страховка от гэпа дешевле, чем кажется.</li>
</ul>
<div class="key">✅ Проверьте: 10 сделок с риском 1% и восемью убытками подряд = −8% счёта. Досадно, но живо. С риском 10% — −80%, для восстановления нужно +400%. Вот почему «рискну побольше» — самая дорогая мысль на рынке.</div>`,
tasks:[
{q:'Депозит 150 000 ₽, риск на сделку 1%. Вход по 500 ₽, стоп по 480 ₽. Какой максимальный размер позиции?',
 a:'Риск = 1 500 ₽. Расстояние до стопа: (500 − 480) / 500 = 4%. Позиция = 1 500 / 0,04 = 37 500 ₽ (75 акций). Если стоп сработает — потеряете ровно 1 500 ₽, то есть 1% счёта.'},
{q:'Почему после просадки 50% для восстановления нужен рост +100%?',
 a:'Проценты считаются от новой, меньшей базы. После −50% от 100 000 осталось 50 000. Чтобы вернуться к 100 000, нужно заработать 50 000 — это 100% от остатка. Чем глубже просадка, тем непропорционально дороже восстановление.'}
]},

{id:6, icon:'🧠', title:'Психология трейдинга', sub:'FOMO, тильт, журнал сделок', min:8, content:`
<p>Ваш главный соперник — не рынок, а вы сами: под эмоциями человек нарушает все правила, которые знал назубок.</p>
<h3>Три главные ловушки</h3>
<ul>
<li><b>FOMO</b> — «всё растёт, я опоздаю!». Покупка на хае без плана, ровно перед откатом.</li>
<li><b>Revenge trading</b> — «сейчас отыграюсь». После убытка вход удвоенной позицией без сетапа. Так сливают депозиты за один вечер.</li>
<li><b>Тильт</b> — серия эмоциональных сделок: без стопов, без анализа, «на удачу».</li>
</ul>
<h3>Инструменты защиты</h3>
<ol>
<li><b>Письменный торговый план.</b> Все правила на бумаге ДО открытия сделки — эмоция не вносит правки в написанное.</li>
<li><b>Журнал сделок.</b> Дата, инструмент, вход/выход, стоп, причина входа, эмоция, результат, урок. Через 50 сделок журнал покажет ваши слабые места лучше любого гуру.</li>
<li><b>Правило паузы:</b> 3 стопа подряд → закрыть терминал до завтра.</li>
<li><b>Размер позиции.</b> Если от каждой сделки «трясёт» — она слишком большая. Уменьшайте, пока не станет скучно: скучно = правильно.</li>
</ol>
<div class="key">✅ Трейдинг — игра вдолгую. Задача не «выиграть эту сделку», а остаться на рынке через год.</div>`,
tasks:[
{q:'Заведите журнал сделок (Google Таблица): колонки — дата, инструмент, направление, вход, стоп, цель, причина входа, эмоция до входа, результат, урок.',
 a:'Это задание без «правильного ответа» — его нужно просто выполнить. Через 30–50 записей посчитайте: какая причина входа приносит прибыль чаще? В каких состояниях вы теряете? Это и есть ваша персональная статистика.'},
{q:'Два стопа подряд. Хочется войти втрое больше, чтобы «вернуть всё сразу». Что делать?',
 a:'Стоп. Это классический revenge trading: увеличенный риск нарушает систему, а вход «назло рынку» — не сетап. Действия: закрыть терминал до завтра, записать обе сделки в журнал с эмоциями, завтра торговать стандартным размером. Серия убытков — нормальная часть любой прибыльной системы.'}
]},

{id:7, icon:'⏱️', title:'Стили торговли', sub:'Скальпинг, дейтрейдинг, свинг', min:6, content:`
<h3>Четыре стиля</h3>
<table>
<tr><th>Стиль</th><th>Удержание</th><th>Кому подходит</th></tr>
<tr><td>Скальпинг</td><td>Секунды–минуты</td><td>Опытным. Комиссии и конкуренция с алгоритмами убивают новичков</td></tr>
<tr><td>Дейтрейдинг</td><td>Внутри дня</td><td>Тем, кто готов 4–6 часов у терминала без отлучек</td></tr>
<tr><td>Свинг</td><td>Дни–недели</td><td>Оптимален для новичка и занятых: анализ вечером, сделки по уровням</td></tr>
<tr><td>Позиционный</td><td>Недели–месяцы</td><td>Терпеливым; больше фундаментала, меньше экрана</td></tr>
</table>
<h3>Почему новичку не скальпинг</h3>
<ul>
<li><b>Комиссии:</b> 20 сделок в день × (вход + выход) — ощутимый минус каждый день.</li>
<li><b>Скорость:</b> вы конкурируете с алгоритмами, реагирующими за миллисекунды.</li>
<li><b>Стресс:</b> десятки решений в день = десятки шансов ошибиться эмоционально.</li>
</ul>
<div class="note">💡 Свинг даёт время подумать: сетапы ищутся вечером, стопы и цели выставляются заранее, эмоциям меньше места. Начните с него.</div>`,
tasks:[
{q:'Честно оцените свой график: сколько часов в день вы реально готовы уделять рынку? Запишите подходящий стиль и почему.',
 a:'Критерий не «как хочется», а «как возможно». Меньше часа в день → свинг или позиционная торговля. 3–4 свободных часа в сессию → можно пробовать дейтрейдинг. Главный провал — выбрать дейтрейдинг, работая в офисе.'},
{q:'Комиссия 0,05% за сделку. Скальпер делает 20 сделок в день (вход + выход по каждой). Сколько процентов в день уходит только на комиссии?',
 a:'0,05% × 2 × 20 = 2% в день. За месяц — 40% и больше только на комиссии. Даже при нулевом результате по сделкам счёт тает. Частота сделок — скрытый враг мелких счетов.'}
]},

{id:8, icon:'🧾', title:'Фьючерсы', sub:'Контракты, ГО, экспирация, ликвидация', min:9, content:`
<p><b>Фьючерс</b> — контракт: купить/продать актив в будущем по цене, зафиксированной сегодня. Вы торгуете не сам актив, а обязательство по контракту.</p>
<h3>Ключевые термины</h3>
<ul>
<li><b>Лонг/шорт</b> — ставка на рост/падение. Шортить так же легко, как покупать.</li>
<li><b>Экспирация</b> — дата окончания контракта. На MOEX: 15 марта, июня, сентября, декабря. Перед экспирацией позицию переносят на следующий контракт (<b>ролл</b>).</li>
<li><b>ГО (гарантийное обеспечение)</b> — залог для открытия позиции, обычно 10–20% стоимости контракта. Отсюда встроенное плечо ×5–×10.</li>
<li><b>Вариационная маржа</b> — ежедневное начисление/списание изменения цены контракта.</li>
</ul>
<h3>Вариационная маржа и клиринг</h3>
<p>Расчётная цена фьючерса фиксируется в <b>клиринг</b> (на MOEX — промежуточный дневной и основной вечерний). По разнице с прошлой расчётной ценой биржа сразу начисляет или списает вариационную маржу — <b>живыми деньгами</b>. На фьючерсах не бывает «бумажного» убытка: минус дня уходит со счёта в тот же вечер, даже если вы ничего не закрывали.</p>
<div class="example">Контракт номиналом 100 000 ₽, ГО 15 000 ₽. Депозит 50 000 ₽: под ГО заблокировано 15 000, свободно 35 000. Вечером цена −5% → списали 5 000 ₽ вариационки, свободно 30 000 — досадно, но запас есть. Тот же день при депозите 17 000 ₽: свободно было 2 000, списали 5 000 — денег под ГО не хватило, позицию принудительно закрыли прямо в клиринг. Цена могла вернуться назавтра — но вас на рынке уже нет.</div>
<ul>
<li>Держите свободный запас не меньше ГО: в волатильные дни биржа может <b>повысить ГО</b>, и под старое обеспечение позиции начнут закрывать.</li>
<li>Маржин-колл по вариационке закрывает позицию по расчётной цене клиринга — не по вашей и не тогда, когда вы решили.</li>
<li>Начисленная вариационка — уже ваш результат: P&L фьючерсов фиксируется ежедневно, а не в момент закрытия сделки.</li>
</ul>
<h3>Популярные контракты MOEX</h3>
<p><b>Si</b> — курс доллара, <b>RTS</b> — индекс, <b>BR</b> — нефть Brent, <b>GD</b> — золото. Пример: фьючерс Si = 1 000 долларов; при курсе 90 ₽ номинал контракта 90 000 ₽, а ГО может быть около 12 000 ₽ — вы управляете суммой в 7+ раз больше залога.</p>
<h3>Крипто-фьючерсы (perpetual)</h3>
<ul>
<li>Без экспирации — держать можно сколько угодно.</li>
<li><b>Фандинг</b>: каждые 8 часов лонги и шорты платят друг другу в зависимости от отклонения цены. В горячем пампе фандинг для лонгов бывает болезненным.</li>
<li><b>Ликвидация</b>: закончилась маржа — биржа закрывает позицию принудительно. Каскадные ликвидации за минуты на крипте — обычное дело.</li>
</ul>
<div class="warnb">⚠️ Фьючерсы — инструмент опытных. Встроенное плечо означает: ошибка прощается в разы меньше, чем в акциях. Освойте сначала акции или спот.</div>
`,
tasks:[
{q:'Номинал фьючерса 100 000 ₽, ГО — 15%. Сколько нужно для открытия и какое эффективное плечо?',
 a:'Залог = 15 000 ₽. Эффективное плечо = 100 000 / 15 000 ≈ ×6,7. Движение цены на 1% даёт ±1 000 ₽ — это ±6,7% к залогу. Движение примерно на 15% против позиции обнуляет залог → ликвидация.'},
{q:'Почему при плече ×10 падение цены на 10% означает потерю 100% средств?',
 a:'Плечо умножает результат: ваш результат = движение цены × плечо. 10% × 10 = 100% маржи. Дальше — принудительное закрытие. Чем выше плечо, тем меньшее движение нужно для обнуления: при ×20 — всего 5%.'},
{q:'Депозит 20 000 ₽, куплен один фьючерс: номинал 100 000 ₽, ГО 15 000 ₽. За день контракт подешевел на 4%. Что спишет клиринг и какой запас хода у вас остался?',
 a:'Клиринг спишет вариационную маржу 4 000 ₽ (4% от 100 000). Свободные средства были 5 000 (20 000 − 15 000 ГО), осталось 1 000 — запаса хватит примерно на 1% движения против позиции, следующее сильное движение закончится принудительным закрытием. Вывод: депозит нужен минимум вдвое больше ГО, иначе берите меньше контрактов.'}
]},

{id:9, icon:'🪙', title:'Криптовалюты', sub:'Специфика рынка, кошельки, скам', min:8, content:`
<h3>Чем крипта отличается от акций</h3>
<ul>
<li><b>24/7/365</b>: рынок не закрывается. Стопы работают ночью; «ночные» пампы и сливы — норма.</li>
<li><b>Волатильность</b> в 5–10 раз выше акций: −30% за неделю для альткоина — обычное движение.</li>
<li><b>Bitcoin задаёт тон</b>: почти всё двигается вместе с BTC, альты — с большей амплитудой. Следите за BTC-доминацией.</li>
<li><b>Слабое регулирование</b>: меньше защиты инвестора, больше мошенничества.</li>
</ul>
<h3>Где хранить</h3>
<ul>
<li><b>CEX</b> (Bybit, OKX и др.) — удобно для торговли, но деньги «у биржи». История помнит FTX.</li>
<li><b>Некастодиальный кошелёк</b> — ключи у вас. <b>Seed-фраза</b> (12–24 слова): записать на бумаге, офлайн, никому никогда. Кто знает seed — тот владеет средствами.</li>
<li><b>Стейблкоины</b> (USDT, USDC) — «цифровой доллар» для пауз между сделками. Тоже несут риск эмитента (вспомните крах TerraUSD).</li>
</ul>
<h3>Скам, на котором теряют деньги</h3>
<ul>
<li><b>Памп-каналы</b>: организаторы покупают ДО сигнала и продают вам на пике.</li>
<li><b>Rug pull</b>: новый «проект», разработчики собирают деньги и исчезают.</li>
<li><b>Фейковая поддержка</b>: «менеджер биржи» в Telegram просит seed или перевод. Поддержка НИКОГДА не просит seed.</li>
<li><b>Фишинг-сайты</b>: домен отличается на одну букву. Проверяйте адрес посимвольно.</li>
<li><b>«Сигналы» и «управление счётом» за подписку</b>: зарабатывает только продавец сигналов.</li>
</ul>
<h3>ЦФА — цифровые финансовые активы</h3>
<p>Токенизированные долги и облигации по российскому закону (259-ФЗ), выпускаются через операторов из реестра ЦБ (Сбер, Атомайз и др.). В отличие от крипты, эмитент известен, а выпуск регулируется. Но: обещанная доходность — обязательство эмитента, ЦФА не застрахованы (это не банковский вклад), а вторичный рынок узкий — выйти раньше срока может быть некому. Перед покупкой проверяйте оператора в реестре ЦБ и читайте, чем обеспечен выпуск.</p>
<h3>NFT</h3>
<p>Невзаимозаменяемые токены — «сертификаты уникальности» картинок и предметов. Волна 2021 года обернулась падением на 90%+ и массой манипуляций: накрутки торгов, скам-коллекции, исчезающие площадки. Ликвидность испаряется мгновенно — то, что покупали за миллион, может оказаться неликвидом навсегда. Для трейдера это спекуляция настроением, а не актив с денежным потоком.</p>
<div class="note">💡 Общее правило для всех неоактивов: непонятный актив — не актив. Если не можете объяснить, откуда берётся доходность и кто эмитент, размер позиции — ноль.</div>`,

{id:10, icon:'🎯', title:'Стратегия и первые шаги', sub:'Торговый план, матожидание, план 3 месяцев', min:9, content:`
<h3>Торговый план — 5 вопросов</h3>
<ol>
<li>Какой рынок и таймфрейм торгую?</li>
<li>По какому условию вхожу? (конкретный сетап словами)</li>
<li>Где стоп? Где цель? (соотношение минимум 1:2)</li>
<li>Какой размер позиции? (по формуле риска 1–2%)</li>
<li>Когда я НЕ торгую? (отчёты и новости, усталость, 3 убытка подряд)</li>
</ol>
<h3>Путь к реальным деньгам</h3>
<ol>
<li><b>Бэктест</b>: прогнать правила по истории — хотя бы 30–50 сделок на бумаге.</li>
<li><b>Демо 1–2 месяца</b>: торговать строго по плану, вести журнал. Нарушение плана = сделка не считается.</li>
<li><b>Микро-реал</b>: минимальный счёт, один инструмент, риск 1%. Реальные деньги учат иначе, чем демо.</li>
</ol>
<h3>Матожидание — судья вашей системы</h3>
<pre>EV = Винрейт × Средний профит − Лузрейт × Средний убыток</pre>
<div class="example">40% сделок прибыльны, средний профит 300 ₽, средний убыток 150 ₽.<br>EV = 0,4 × 300 − 0,6 × 150 = 120 − 90 = <b>+30 ₽ со сделки</b>. Система прибыльная — при соблюдении рисков и дисциплины.</div>
<h3>Метрики системы из бэктеста</h3>
<ul>
<li><b>Profit Factor</b> = сумма прибылей / сумма убытков. Для старта ищите больше 1,5.</li>
<li><b>Максимальная просадка (Max Drawdown)</b> — худшая точка кривой доходности. Она должна быть психологически подъёмной: просадку в 30% выдерживают немногие.</li>
<li><b>Максимальная серия убытков</b> — сколько стопов подряд выдала история. Если 8 — готовьтесь к 8 подряд и на реале: это норма системы, а не «она сломалась».</li>
</ul>
<div class="note">💡 Сравните результат бэктеста с безрисковой ставкой (ОФЗ, депозит) за тот же период. Если система даёт заметно меньше — она не оправдывает свой риск, какой бы интересной ни казалась.</div>
<h3>Чек-лист перед каждой сделкой</h3>
<ul>
<li>Есть сетап по плану, а не «похоже, сейчас полетит»?</li>
<li>Стоп выставлен? Цель известна? R:R не хуже 1:2?</li>
<li>Размер посчитан по риску 1–2%?</li>
<li>Сегодня нет важных новостей по активу?</li>
<li>Я спокоен? Не отыгрываюсь после убытка?</li>
</ul>
<h3>План первых 3 месяцев</h3>
<ul>
<li><b>Недели 1–2:</b> модули 1–2, демо-счёт, освоить терминал (TradingView для графиков).</li>
<li><b>Недели 3–8:</b> демо строго по плану, журнал каждой сделки.</li>
<li><b>Недели 9–12:</b> микро-реальный счёт, один инструмент, риск 1%, еженедельный разбор журнала.</li>
</ul>
<h3>Красные флаги — бегите</h3>
<ul>
<li>«Гарантированный доход», «10× за месяц».</li>
<li>Продажа сигналов и «управление вашим счётом».</li>
<li>Каналы, пампящие монету перед распродажей.</li>
<li>Брокеры без лицензии и «разблокировка прибыли за доплату».</li>
</ul>
<div class="key">🎓 Главное: 90% результата — риск-менеджмент и дисциплина, и только 10% — «угадал движение». Сохраняйте капитал, и рынок даст вам время научиться.</div>`,
tasks:[
{q:'Напишите свой торговый план по 5 вопросам из урока. Распечатайте или держите заметкой на видном месте.',
 a:'Критерий готового плана: другой человек, прочитав его, сможет исполнить вашу сделку без вопросов. Если где-то написано «по ситуации» — план не готов, уточните правило. Дальше — бэктест и 1–2 месяца демо.'},
{q:'Винрейт системы 35%, средний профит 400 ₽, средний убыток 150 ₽. Посчитайте матожидание. Прибыльна ли система?',

]},

{id:11, icon:'💰', title:'Налоги и обязательства', sub:'НДФЛ, ЛДВ, ИИС, декларации', min:8, content:`
<h3>НДФЛ на трейдинг</h3>
<p>Прибыль от продажи ценных бумаг — доход. Ставка 13%, с части совокупного дохода свыше 2,4 млн ₽ в год — 15%. Брокер — налоговый агент: считает и удерживает налог сам, при выводе денег или по итогам года.</p>
<ul>
<li><b>Сальдирование внутри года автоматическое</b> — но только внутри одного сегмента: акции с акциями, фьючерсы с фьючерсами. Убыток по срочному рынку не уменьшает налог по фондовому (и наоборот).</li>
<li><b>Дивиденды</b> — тот же НДФЛ 13%, удерживается при выплате.</li>
<li><b>Перенос убытков прошлых лет:</b> убыточный год можно учесть до 10 лет вперёд — но только через декларацию 3-НДФЛ и заявление брокеру, само не применится.</li>
</ul>
<h3>Льгота долгосрочного владения (ЛДВ)</h3>
<p>Держали бумагу 3 года и дольше — освобождение от НДФЛ при продаже, в пределах 3 млн ₽ за каждый полный год владения (3 года = до 9 млн ₽). Работает и на «забытых» покупках, и на осознанных долгих позициях.</p>
<h3>ИИС — вторая нога</h3>
<p>Инвестсчёт (ИИС-3) даёт вычет на взносы и освобождение прибыли при сроке от 5 лет. Для активного трейдинга он тесноват, но параллельный ИИС с длинной частью портфеля — разумная привычка. Изучите условия до открытия.</p>
<h3>Крипта — платите сами</h3>
<ul>
<li>Биржа не налоговый агент: декларация 3-НДФЛ подаётся самостоятельно до 30 апреля.</li>
<li>Доход считается в рублях по курсу ЦБ на дату каждой сделки.</li>
<li>С 2026 года (по разъяснениям Минфина) обмен «крипта → крипта» тоже считается реализацией: налог начисляется по каждой конвертации, даже если рубли не выводились.</li>
<li>Сохраняйте выписки со сделками: без документов расходы подтвердить невозможно.</li>
</ul>
<div class="note">💡 Поставьте напоминание на январь: запросить у брокера налоговый отчёт за год и сверить, что убытки зафиксированы. В приложении это делается за пять минут.</div>
<div class="warnb">⚠️ Налоги и комиссии — часть расходов системы. При активной торговле они легко съедают 5–15% годовой доходности. Закладывайте их в ожидания заранее, а не постфактум.</div>`,
tasks:[
{q:'За год вы заработали 150 000 ₽ на акциях и потеряли 90 000 ₽ на фьючерсах. Один брокер, один счёт. С какой суммы заплатите налог?',
 a:'Со всех 150 000 ₽. Фондовый и срочный рынок — разные налоговые базы: убыток по фьючерсам не уменьшает налог по акциям. Сальдирование работает только внутри сегмента (акции с акциями, фьючерсы с фьючерсами). Налог: 150 000 × 13% = 19 500 ₽. Это аргумент не смешивать сегменты одной стратегией без учёта налогов.'},
{q:'Вы торгуете крипту: рубли не выводили, только меняли BTC на USDT и обратно. Нужно ли что-то декларировать?',
 a:'Да. С 2026 года конвертация «крипта → крипта» — реализация: по каждой обменной операции считается рублёвый доход по курсу ЦБ на дату сделки, и разница с расходами облагается НДФЛ. Декларация подаётся самостоятельно до 30 апреля следующего года. Без выписок со сделками расходы не подтвердить — храните историю.'}

{id:12, icon:'🎛️', title:'Управление позицией', sub:'Безубыток, трейлинг, частичная фиксация', min:9, content:`
<p>Сделка не заканчивается на кнопке «купить» — вход это только треть работы. Что происходит с позицией потом, отличает систему от импровизации.</p>
<h3>Перенос стопа в безубыток</h3>
<p>Цена прошла в вашу сторону <b>1R</b> (расстояние от входа до стопа) — переносите стоп на цену входа. Худший исход становится нулём (минус комиссии). Важно: не переносите сразу после входа — обычный шум выбьет сделку, которая отработала бы.</p>
<h3>Трейлинг-стоп</h3>
<p>В тренде стоп «едет» за ценой: на расстоянии 2–3 ATR или за EMA20 младшего таймфрейма. Вы не угадываете вершину — даёте прибыли течь, пока тренд жив, и выходите, когда он сломался. Именно трейлинг превращает редкие трендовые сделки в основную прибыль свинг-трейдера.</p>
<h3>Частичная фиксация</h3>
<div class="example">Вход 200 ₽, стоп 190 ₽ (риск 1 000 ₽ = 1R на 100 акций), цель 220 ₽.<br>Цена дошла до 210 (+1R): закрываем половину (+500 ₽), стоп остатка переносим в безубыток (200 ₽).<br>Худший итог с этой точки: +500 ₽. Лучший (по цели 220): +1 500 ₽ = +1,5R при исходном риске 1R. Психологически сделка становится «бесплатной» — её легко держать до цели.</div>
<h3>Добавление и усреднение</h3>
<ul>
<li><b>Пирамидинг</b> — добавление в прибыльную позицию по тем же правилам (новая порция = новый расчёт риска 1%), стоп всей серии подтягивается под самый младший вход.</li>
<li><b>Усреднение в убыток</b> — «докупить подешевле» против своей же системы — запрещено. Это главный способ превратить плановый убыток 1% в 10%+.</li>
</ul>
<h3>Логический стоп</h3>
<p>Причина сделки исчезла — выходите, даже если цена не дошла до стопа: пробили уровень, на котором строился вход; вышла новость, меняющая логику; сетап «перегорел» и цена просто висит. Цена ещё «терпит», но вашей сделки уже нет. Стоп-лосс защищает депозит, логический стоп — не сидеть в мёртвой позиции.</p>
<div class="key">🎓 Управление позицией — третий кит после риск-менеджмента и психологии: вход решает меньше, чем то, что вы делаете после него.</div>`,
tasks:[
{q:'Вход 500 ₽, стоп 480 ₽, цель 540 ₽, позиция 75 акций (риск 1 500 ₽). Цена дошла до 520. Опишите действия по схеме «половина + безубыток» и итоги в рублях.',
 a:'+1R = 20 ₽ на акцию. Закрываем 37 акций: +740 ₽. Стоп остатка (38 акций) — на 500 ₽. Худший итог: +740 ₽, убыток невозможен. По цели 540: +740 + 38 × 40 = +2 260 ₽ ≈ +1,5R при исходном риске 1 500 ₽.'},
{q:'Позиция ушла в минус на −0,7R. Знакомый советует докупить, чтобы «усредниться — выйдет дешевле». Ваши действия?',
 a:'Отказаться. Докупка в убыток увеличивает риск именно тогда, когда система говорит «я ошиблась»: если цена дойдёт до стопа, убыток станет кратно больше планового. Усреднение — привилегия инвестора с горизонтом в годы; для трейдера это нарушение системы. Работает стоп — работает и всё остальное.'}
]},

{id:13, icon:'🎫', title:'Опционы: основы', sub:'Колл и пут, премия, стратегии', min:10, content:`
<p><b>Опцион</b> — контракт, дающий <b>право</b> (но не обязанность) купить или продать актив по фиксированной цене (<b>страйк</b>) до определённой даты (<b>экспирация</b>). За это право покупатель платит продавцу <b>премию</b>. Опцион на покупку — <b>колл</b>, на продажу — <b>пут</b>.</p>
<h3>Две стороны сделки</h3>
<ul>
<li><b>Покупатель</b> платит премию — как за страховку. Его риск ограничен премией, прибыль по коллу не ограничена. Но время работает против: цена не дошла — премия сгорела полностью.</li>
<li><b>Продавец</b> получает премию — как страховая компания. Его доход ограничен премией, а риск при продаже «голого» колла теоретически не ограничен. Ошибка стоит кратно больше заработка.</li>
</ul>
<h3>Из чего состоит премия</h3>
<ul>
<li><b>Внутренняя стоимость</b> — насколько опцион «в деньгах»: колл со страйком 100 при цене 110 содержит 10 внутренней стоимости.</li>
<li><b>Временная стоимость</b> — плата за шанс, что цена дойдёт до экспирации. Она <b>тает каждый день</b> (временной распад) и ускоряется приближении даты экспирации.</li>
<li><b>Волатильность (IV)</b> — чем сильнее рынок ждёт движения, тем дороже опционы. После резких обвалов опционы самые дорогие — ровно тогда, когда хочется «купить дёшево со страховкой».</li>
</ul>
<div class="warnb">⚠️ Главная ловушка новичка: угадать направление и всё равно потерять. Цена растёт, но медленнее или позже, чем вы рассчитывали, — временная стоимость сгорает быстрее, чем набирается внутренняя. Опцион может быть «прав» по тренду и минусовым по деньгам.</div>
<h3>Две разумные стартовые стратегии</h3>
<ul>
<li><b>Защитный пут</b> — покупка пута на уже открытую позицию как страховка: при обвале пут компенсирует падение. В отличие от стопа, его не выбивает шумом — но страховка стоит премии, и её придётся покупать снова.</li>
<li><b>Покрытый колл (covered call)</b> — на длинную позицию продаём колл выше текущей цены: премия ваша сразу, взамен вы отказываетесь от роста выше страйка.</li>
</ul>
<div class="example">Держите 100 акций по 200 ₽. Продали колл со страйком 220 ₽ за премию 5 ₽ → +500 ₽ сразу. Цена к экспирации 215 — премия ваша. Выше 220 — обязаны продать по 220: прибыль зафиксирована, но сверхприбыль упущена. Стратегия для боковиков и длинных позиций, которые не жалко отдать по цели.</div>
<h3>Где торгуются</h3>
<p>На MOEX — опционы на фьючерсы (Si, RTS, нефть, золото); ликвидность концентрируется в ближайших сериях, спреды шире, чем у фьючерсов. На крипте — Deribit и крупные биржи. Честно: новичку для простых направленных сделок почти всегда хватает фьючерсов и стопов.</p>
<div class="key">🎫 Правило: покупка опциона ограничивает риск премией; продажа «голого» ограничивает доход и не ограничивает риск. Начинать — только с покупки, и никогда не продавать непокрытые опционы.</div>`,
tasks:[
{q:'Купили колл со страйком 100 ₽ за премию 3 ₽. Посчитайте итог к экспирации при цене: а) 106; б) 101; в) 95. Почему в случаях б) и в) результат одинаковый?',
 a:'а) Внутренняя стоимость 6 − премия 3 = +3 ₽ — премия удвоилась. б) и в) −3 ₽: право купить по 100 при цене ниже 100 ничего не стоит, исполнять его незачем. Потеря покупателя всегда ограничена премией — в этом преимущество перед фьючерсом, где убыток не ограничен.'},
{q:'Знакомый предлагает «просто продавать путы на индекс»: премия капает каждый месяц, риск «небольшой». В чём подвох?',
 a:'У продавца доход ограничен премией, а риск — нет: при обвале пут уходит глубоко «в деньги», и один кризисный месяц стирает премии за несколько лет, легко доводя до маржин-колла. Это статистическое преимущество на спокойном рынке и катастрофический хвостовой риск на нервном. Продажа непокрытых опционов — не «лёгкие деньги», а страховой бизнес без резервов.'}
]}
];

const app = document.getElementById('app');

function getProgress(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
function setProgress(p){ localStorage.setItem(KEY, JSON.stringify(p)); }
function isDone(id){ return getProgress().includes(id); }

function updateHeader(){
  const p = getProgress();
  const pct = Math.round(p.length / MODULES.length * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = p.length + ' / ' + MODULES.length;
}

function renderHome(){
  const done = getProgress();
  const cards = MODULES.map(m=>{
    const d = done.includes(m.id);
    return '<a class="card' + (d ? ' card-done' : '') + '" href="#m' + m.id + '">' +
      '<div class="card-top"><span class="icon">' + m.icon + '</span>' + (d ? '<span class="check">✓</span>' : '') + '</div>' +
      '<div class="card-num">Модуль ' + m.id + ' · ' + m.min + ' мин</div>' +
      '<div class="card-title">' + m.title + '</div>' +
      '<div class="card-sub">' + m.sub + '</div></a>';
  }).join('');
  app.innerHTML =
    '<section class="hero"><h1>Курс по трейдингу</h1>' +
    '<p>Акции, фьючерсы и крипта — с нуля до первой стратегии. 13 модулей, практика и задания с проверкой.</p>' +
    '<div class="warnb">⚠️ По статистике 70–95% активных трейдеров теряют деньги. Курс — про понимание рынка и дисциплину, а не про «быстрые деньги». Не рискуйте средствами, потеря которых критична.</div></section>' +
    '<div class="grid">' + cards + '</div>' +
    '<button class="btn-outline" onclick="resetProgress()">Сбросить прогресс</button>';
}

function renderLesson(id){
  const m = MODULES.find(x=>x.id===id);
  if(!m){ renderHome(); return; }
  const prev = MODULES.find(x=>x.id===id-1);
  const next = MODULES.find(x=>x.id===id+1);
  const d = isDone(id);
  const tasks = m.tasks.map((t,i)=>
    '<div class="task"><div class="task-q"><b>Задание ' + (i+1) + '.</b> ' + t.q + '</div>' +
    '<button class="btn small" onclick="toggleAnswer(this)">Показать ответ</button>' +
    '<div class="answer">' + t.a + '</div></div>').join('');
  app.innerHTML =
    '<a class="back" href="#">← Все модули</a>' +
    '<article class="lesson">' +
    '<div class="lesson-head"><span class="icon big">' + m.icon + '</span>' +
    '<div><div class="card-num">Модуль ' + m.id + ' · ' + m.min + ' мин чтения</div><h1>' + m.title + '</h1></div></div>' +
    '<button id="doneBtn" class="btn' + (d ? ' done' : '') + '" onclick="toggleDone(' + m.id + ')">' + (d ? '✓ Пройдено' : 'Отметить пройденным') + '</button>' +
    m.content +
    '<h3>📝 Задания</h3>' + tasks +
    '<div class="nav">' +
    (prev ? '<a class="btn-outline" href="#m' + prev.id + '">← ' + prev.title + '</a>' : '<span></span>') +
    (next ? '<a class="btn-outline" href="#m' + next.id + '">' + next.title + ' →</a>' : '<a class="btn-outline" href="#">🎉 К списку модулей</a>') +
    '</div></article>';
}

function route(){
  const match = location.hash.match(/^#m(\d+)$/);
  if(match){ renderLesson(+match[1]); } else { renderHome(); }
  window.scrollTo(0,0);
}

function toggleDone(id){
  let p = getProgress();
  p = p.includes(id) ? p.filter(x=>x!==id) : p.concat(id);
  setProgress(p);
  const btn = document.getElementById('doneBtn');
  if(btn){
    const d = p.includes(id);
    btn.textContent = d ? '✓ Пройдено' : 'Отметить пройденным';
    btn.classList.toggle('done', d);
  }
  updateHeader();
}

function toggleAnswer(btn){
  const ans = btn.nextElementSibling;
  ans.classList.toggle('open');
  btn.textContent = ans.classList.contains('open') ? 'Скрыть ответ' : 'Показать ответ';
}

function resetProgress(){
  if(confirm('Сбросить весь прогресс?')){
    localStorage.removeItem(KEY);
    updateHeader();
    route();
  }
}

window.addEventListener('hashchange', route);
applyTheme(localStorage.getItem(THEME_KEY) || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
route();
updateHeader();
</script>
</body>
</html>
